models:
- name: marketing_campaigns
  table: marketing_campaigns
  dimensions:
  - name: campaign_name
    type: categorical
  - name: channel
    type: categorical
  - name: start_date
    type: time
    granularity: day
  - name: end_date
    type: time
    granularity: day
  metrics:
  - name: record_count
    agg: count
  - name: total_campaign_id
    agg: sum
    sql: campaign_id
  - name: total_budget
    agg: sum
    sql: budget
