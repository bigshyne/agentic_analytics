models:
- name: reviews
  table: reviews
  primary_key: review_id
  relationships:
  - name: item
    type: many_to_one
    foreign_key: item_id
  - name: account
    type: many_to_one
    foreign_key: account_id
  dimensions:
  - name: created_at
    type: time
    granularity: day
  metrics:
  - name: record_count
    agg: count
  - name: total_rating
    agg: sum
    sql: rating
