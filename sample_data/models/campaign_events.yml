models:
- name: campaign_events
  table: campaign_events
  primary_key: campaign_event_id
  relationships:
  - name: account
    type: many_to_one
    foreign_key: account_id
  dimensions:
  - name: event_type
    type: categorical
  - name: event_date
    type: time
    granularity: day
  metrics:
  - name: record_count
    agg: count
  - name: total_campaign_id
    agg: sum
    sql: campaign_id
