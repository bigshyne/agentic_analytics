models:
- name: discounts
  table: discounts
  primary_key: discount_id
  dimensions:
  - name: code
    type: categorical
  - name: description
    type: categorical
  - name: valid_from
    type: time
    granularity: day
  - name: valid_to
    type: time
    granularity: day
  metrics:
  - name: record_count
    agg: count
  - name: total_discount_pct
    agg: sum
    sql: discount_pct
